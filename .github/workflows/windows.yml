name: Verify and package native apps
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Build native development app and target
        run: cargo build --locked --bin console-ui --example instrumented
      - name: Exercise native development UI before packaging
        shell: pwsh
        run: |
          ./scripts/smoke-windows.ps1 -Executable ./target/debug/console-ui.exe
          Move-Item dist/smoke-native-recording.tcui dist/smoke-debug-recording.tcui
      - name: Create self-contained x64 package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Exercise packaged native UI
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-ui-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/smoke-*.png
            dist/smoke-*.log
            dist/smoke-*.tcui
            dist/smoke-*.json
          if-no-files-found: error
  linux-native:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb dbus-x11 weston
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p console-ui-gtk -- -D warnings
      - run: cargo build --locked --example instrumented -p console-ui
      - run: cargo build --locked -p console-ui-gtk
      - name: Exercise native GTK frontend on X11
        run: bash scripts/smoke-linux.sh x11
      - name: Exercise native GTK frontend on Wayland
        run: bash scripts/smoke-linux.sh wayland
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-ui-linux
          path: |
            dist/console-ui-linux-*.tar.gz*
            dist/smoke-linux-*.log
            dist/smoke-linux-*.png
  macos-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Typecheck native Swift frontend
        run: xcrun swiftc -swift-version 5 -typecheck -parse-as-library -import-objc-header platforms/macos/include/console_ui.h platforms/macos/Sources/ConsoleUI.swift
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: bash scripts/package-macos.sh
      - run: cargo build --locked --example instrumented
      - name: Exercise native SwiftUI frontend
        run: bash scripts/smoke-macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-ui-macos
          path: |
            dist/console-ui-macos-*.zip*
            dist/smoke-macos.log
            dist/smoke-macos.png
