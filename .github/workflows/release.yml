name: Release builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      distribution:
        description: Signed distribution or unsigned preview build
        type: choice
        options: [signed, preview]
        default: signed
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/**'
      - 'platforms/macos/Info.plist'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      signed: ${{ steps.version.outputs.signed }}
      signing_identity: ${{ steps.version.outputs.signing_identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate version, ref, and signing policy
        id: version
        env:
          DISTRIBUTION: ${{ github.event_name == 'pull_request' && 'preview' || inputs.distribution || 'signed' }}
        run: python3 scripts/release_assets.py metadata --distribution "$DISTRIBUTION"
  checks:
    needs: metadata
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
  packages-preview:
    name: Preview ${{ matrix.platform }}
    needs: [metadata, checks]
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' && needs.metadata.outputs.signed == 'false' &&
          (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # PR code receives neither signing credentials nor OIDC permissions.
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-native
        with:
          platform: ${{ matrix.platform }}
          version: ${{ needs.metadata.outputs.version }}
          source_sha: ${{ needs.metadata.outputs.source_sha }}
          signed: 'false'
  packages-signed:
    name: Sign ${{ matrix.platform }}
    needs: [metadata, checks]
    if: ${{ !cancelled() && needs.metadata.result == 'success' && needs.metadata.outputs.signed == 'true' && needs.checks.result == 'success' }}
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-native
        with:
          platform: ${{ matrix.platform }}
          version: ${{ needs.metadata.outputs.version }}
          source_sha: ${{ needs.metadata.outputs.source_sha }}
          signed: 'true'
          identity: ${{ needs.metadata.outputs.signing_identity }}
          macos_certificate: ${{ matrix.platform == 'macos-arm64' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          macos_password: ${{ matrix.platform == 'macos-arm64' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          macos_notary_key: ${{ matrix.platform == 'macos-arm64' && secrets.MACOS_NOTARY_KEY_P8_BASE64 || '' }}
        # Environment-level variables are available after the job starts.
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
  verify-artifacts:
    name: Verify release assets
    needs: [metadata, packages-preview, packages-signed]
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' &&
          ((needs.metadata.outputs.signed == 'true' && needs.packages-signed.result == 'success') ||
           (needs.metadata.outputs.signed == 'false' && needs.packages-preview.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
      DISTRIBUTION: ${{ needs.metadata.outputs.signed == 'true' && 'signed' || 'preview' }}
      SIGNING_IDENTITY: ${{ needs.metadata.outputs.signing_identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete asset inventory, checksums, and source manifests
        run: python3 scripts/release_assets.py verify --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA" --distribution "$DISTRIBUTION" --identity "$SIGNING_IDENTITY"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: needs.metadata.outputs.signed == 'true'
        with:
          cosign-release: v3.1.4
      - name: Independently verify every Sigstore signature and workflow identity
        if: needs.metadata.outputs.signed == 'true'
        run: bash scripts/verify-release-signatures.sh release-assets "$SIGNING_IDENTITY" "$SOURCE_SHA" "$GITHUB_REPOSITORY"
  draft-release:
    name: Stage signed draft GitHub release
    needs: [metadata, verify-artifacts]
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && needs.metadata.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true
      - name: Create or refresh verified draft assets
        shell: bash
        run: |
          tag_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$tag_commit" = "$SOURCE_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json, sys; sys.exit(0 if json.load(open("release-state.json"))["isDraft"] else "Refusing to replace assets on a published release")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Console UI $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
