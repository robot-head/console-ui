[package]
name = "console-ui-gtk"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native GTK4/Relm4 frontend for Console UI"

[dependencies]
console-ui = { path = "../..", default-features = false, features = ["tls"] }
relm4 = "0.11"
anyhow = "1"
serde_json = "1"
humantime = "2"
shlex = "1"
clap = "4.5"

